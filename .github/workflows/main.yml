name: Deploy to store
on:
  push:
    branches:
      - store
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Check Network Connectivity
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          PORT="${{ secrets.SSH_PORT }}"
          
          echo "Target Host: $HOST"
          echo "Target Port: $PORT"
          echo ""
          echo "Testing TCP connection to $HOST:$PORT..."
          timeout 10 bash -c "echo > /dev/tcp/$HOST/$PORT" && echo "✅ Port IS reachable" || echo "❌ Port is NOT reachable"
          echo ""
          echo "GitHub runner IP..."
          curl -s https://api.ipify.org?format=json

      - name: 🚀 Execute Deployment Script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          debug: true
          script: |
            echo "=== Connection Successful ==="
            whoami
            hostname
            pwd
            echo ""
            echo "=== Starting Deployment ==="
            cd /www/wwwroot/website_upgraded
            bash deploy_script.sh
